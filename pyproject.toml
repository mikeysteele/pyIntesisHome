[project]
name = "pyintesishome"
version = "2.5.0"
description = "A python3 library for running asynchronus communications with IntesisHome Smart AC Controllers"
readme = "README.md"
# 3.12 rewrote asyncio.wait_for on top of asyncio.timeout. Earlier
# versions discard a cancellation delivered while the future being
# waited on has already completed, which the poller's shutdown path
# would otherwise have to keep working around untested.
requires-python = ">=3.12"
authors = [{ name = "James Nimmo", email = "james@nimmo.net.nz" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Home Automation",
]
urls = { Repository = "https://github.com/jnimmo/pyIntesisHome" }
dependencies = ["aiohttp>=3.7.4,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyintesishome"]

[dependency-groups]
dev = [
    "aioresponses",
    "aiohttp<3.14",
    "pylint==4.0.5",
    "pytest==9.0.3",
    "pytest-aiohttp==1.1.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
